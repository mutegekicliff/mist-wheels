<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="rimGradLight" x1="4" y1="4" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="0.6" stop-color="#0369A1"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="monoGradLight" x1="16" y1="14" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="hubGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Wheel Mark -->
  <g transform="translate(4, 0)">
    <!-- Base Background -->
    <circle cx="30" cy="30" r="27" fill="#0F172A"/>
    <circle cx="30" cy="30" r="26" fill="url(#hubGlowLight)"/>

    <!-- Machined Alloy Outer Rim -->
    <circle cx="30" cy="30" r="25" stroke="url(#rimGradLight)" stroke-width="2.5"/>

    <!-- Brake Disc / Spoke Circle -->
    <circle cx="30" cy="30" r="20" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Top M Monogram (Sharp geometric precision) -->
    <path d="M17 33 V20 L23.5 26.5 L30 20 L36.5 26.5 L43 20 V33" 
          stroke="url(#monoGradLight)" 
          stroke-width="2.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom W Spokes Geometry -->
    <path d="M21 25.5 L25 40 L30 34.5 L35 40 L39 25.5" 
          stroke="#38BDF8" 
          stroke-width="2.4" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.95"/>

    <!-- Precision Centre Hub -->
    <circle cx="30" cy="30" r="2.4" fill="#FFFFFF"/>
    <circle cx="30" cy="30" r="1.1" fill="#0284C7"/>

    <!-- Mist Steam Arc Detail -->
    <path d="M45 17 C48.5 21, 50 26, 50 30 C50 35, 46.5 41, 43 44" 
          stroke="#38BDF8" 
          stroke-width="1.4" 
          stroke-linecap="round" 
          stroke-dasharray="2 3" 
          opacity="0.8"/>
  </g>

  <!-- Brand Typography for Light Theme Header -->
  <g transform="translate(70, 0)">
    <!-- MIST WHEELS Wordmark -->
    <text x="0" y="34" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      MIST<tspan fill="#0284C7" dx="4">WHEELS</tspan>
    </text>
    
    <!-- Subtitle / Location -->
    <text x="1" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="2.8">
      MOBILE CAR CARE • KAMPALA
    </text>
  </g>
</svg>
